[package]
name = "bevy_gltf_draco"
authors = ["jiang heng <https://github.com/jiangheng90/"]
description = "a draco decoder on rust (wip)"
repository = "https://github.com/jiangheng90-opensource/bevy_gltf_draco"
homepage = "https://github.com/jiangheng90-opensource/bevy_gltf_draco"
keywords = ["bevy", "draco", "decoder"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_asset = { git = "https://github.com/jiangheng90/bevy", branch = "async-handler-hook" }
bevy_platform = { git = "https://github.com/jiangheng90/bevy", branch = "async-handler-hook" }
bevy_gltf = { git = "https://github.com/jiangheng90/bevy", branch = "async-handler-hook" }
bevy_ecs = { git = "https://github.com/jiangheng90/bevy", branch = "async-handler-hook" }
bevy_mesh = { git = "https://github.com/jiangheng90/bevy", branch = "async-handler-hook" }
bevy_app = { git = "https://github.com/jiangheng90/bevy", branch = "async-handler-hook" }
bevy_tasks = { git = "https://github.com/jiangheng90/bevy", branch = "async-handler-hook" }
gltf = { version = "1.4.0", default-features = false, features = [
    "KHR_lights_punctual",
    "KHR_materials_transmission",
    "KHR_materials_ior",
    "KHR_materials_volume",
    "KHR_materials_unlit",
    "KHR_materials_emissive_strength",
    "KHR_texture_transform",
    "extras",
    "extensions",
    "names",
    "utils",
] }
draco_decoder = { version = "0.0.26" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
tracing = { version = "0.1", default-features = false, features = ["std"] }
async-trait = "0.1.89"
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
bevy = { git = "https://github.com/jiangheng90/bevy", branch = "async-handler-hook", features = ["jpeg", "bevy_animation"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Request",
    "RequestInit",
    "Response",
    "Window",
    "Headers",
    "console",
] }
js-sys = "0.3"

[[example]]
name = "main"
path = "examples/main.rs"
required-features = []

[patch."https://github.com/jiangheng90/bevy"]
bevy = { path = "../bevy" }
bevy_asset = { path = "../bevy/crates/bevy_asset" }
bevy_platform = { path = "../bevy/crates/bevy_platform" }
bevy_gltf = { path = "../bevy/crates/bevy_gltf" }
bevy_ecs = { path = "../bevy/crates/bevy_ecs" }
bevy_mesh = { path = "../bevy/crates/bevy_mesh" }
bevy_app = { path = "../bevy/crates/bevy_app" }
bevy_tasks = { path = "../bevy/crates/bevy_tasks" }
